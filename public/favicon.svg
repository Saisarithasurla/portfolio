<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Slate to Dark Indigo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Bracket Gradient: Electric Indigo to Cyan -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Slash Gradient: Vibrant Cyan -->
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#4f46e5" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Modern Rounded Container (Squircle) -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#glow)" />

  <!-- Left Bracket < -->
  <path d="M21 21 L11 32 L21 43" 
        stroke="url(#bracketGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Code Slash / -->
  <line x1="37" y1="18" x2="27" y2="46" 
        stroke="url(#slashGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Right Bracket > -->
  <path d="M43 21 L53 32 L43 43" 
        stroke="url(#bracketGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Glowing Tech Core Accent Dot -->
  <circle cx="32" cy="12" r="2.5" fill="#38bdf8" />
</svg>